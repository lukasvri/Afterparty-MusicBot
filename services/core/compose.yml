name: gutta-krutt-core
services:
  core:
    image: gutta-krutt-core:2.0.1
    build: .
    container_name: gutta-krutt-core
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      CORE_PORT: "3990"
    ports:
      - "127.0.0.1:3990:3990"
    volumes:
      - core-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Eight concurrent crossfades can exceed 128 FFmpeg/Node tasks.
    pids_limit: 512
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3990/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  core-data:
