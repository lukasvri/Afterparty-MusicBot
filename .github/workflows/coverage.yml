name: Unit coverage
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      upload_coverage:
        description: Upload reports to Codecov and consume one upload
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  # Coverage needs the latest baseline, unlike the separate release workflow.
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  coverage:
    # Full validation still runs for drafts. Save optional coverage uploads for review.
    # Forks and Dependabot receive no OIDC grant.
    if: (vars.CODECOV_ENABLED == 'true' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/core/package-lock.json
            apps/web/package-lock.json
      - name: Reuse downloaded FFmpeg packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/afterparty-ffmpeg/*.deb
          key: ffmpeg-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('.github/workflows/coverage.yml') }}
      - name: Ensure FFmpeg is available for real audio tests
        timeout-minutes: 3
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            mkdir -p "$RUNNER_TEMP/afterparty-ffmpeg"
            sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/afterparty-ffmpeg" -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix services/core ci --omit=peer --ignore-scripts --no-audit --no-fund
      - run: npm --prefix apps/web ci --no-audit --no-fund
      - run: npm run coverage:unit
      - name: Upload the three scoped reports once, without a long-lived token
        if: vars.CODECOV_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || inputs.upload_coverage)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/shared.lcov,coverage/core.lcov,coverage/native.lcov
          disable_search: true
          disable_telem: true
          fail_ci_if_error: true
          handle_no_reports_found: false
