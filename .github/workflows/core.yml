name: Core validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      coverage_only:
        description: Run instrumented coverage instead of normal validation
        type: boolean
        default: false
      upload_coverage:
        description: Upload the manual coverage reports to Codecov
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Only superseded PRs share a group. Every main push keeps its release run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  deployer:
    name: ${{ github.event_name == 'workflow_dispatch' && 'manual / deployer' || 'deployer' }}
    if: github.event_name != 'workflow_dispatch' || !inputs.coverage_only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Deployment failure and recovery tests with synthetic data
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s operations/update-panel -p 'test_*.py' -v
  core:
    name: ${{ github.event_name == 'workflow_dispatch' && 'manual / core' || 'core' }}
    if: github.event_name != 'workflow_dispatch' || !inputs.coverage_only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Test and build the final image with reusable layers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
          DOCKER_BUILD_SUMMARY: 'false'
        with:
          context: services/core
          target: final
          platforms: linux/amd64
          load: true
          push: false
          tags: gutta-krutt-core:git-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=core-linux-amd64
          cache-to: type=gha,scope=core-linux-amd64,mode=max
          # The release job signs the archives separately. Keep one saved image.
          provenance: false
          sbom: false
      - name: Probe the tested final image without creating unused PR archives
        if: github.event_name != 'push'
        run: python3 scripts/build_release.py core-probe
      - name: Probe and package the tested final image without rebuilding
        if: github.event_name == 'push'
        run: python3 scripts/build_release.py core-package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: tested-core
          path: |
            release-assets/core-image.tar.gz
            release-assets/core.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          archive: true
          overwrite: true
  website:
    name: ${{ github.event_name == 'workflow_dispatch' && 'manual / website' || 'website' }}
    if: github.event_name != 'workflow_dispatch' || !inputs.coverage_only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Public build configuration, never Sentry authentication/upload tokens.
    env:
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      WRANGLER_WRITE_LOGS: 'true'
      WRANGLER_LOG_PATH: /tmp/afterparty-wrangler
      PLAYWRIGHT_BROWSERS_PATH: /tmp/afterparty-playwright
      CI_EVENT_NAME: ${{ github.event_name }}
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/core/package-lock.json
            apps/web/package-lock.json
      - name: Report Node.js runtime (Node 26 compatibility trial)
        run: node --version
      - run: npm ci --no-audit --no-fund
      - name: Install locked Core dependencies for typed integration fixtures
        run: npm --prefix services/core ci --omit=peer --ignore-scripts --no-audit --no-fund
      - name: Install locked native website dependencies
        run: npm --prefix apps/web ci --no-audit --no-fund
      - name: Lint, typecheck and shared contract tests
        run: |
          npm run lint
          npm run audit:unused
          node node_modules/typescript/bin/tsc --noEmit --incremental false
          npm run test:unit
      - name: Validate the native website
        run: |
          npm --prefix apps/web run format:check
          npm --prefix apps/web run check
          npm --prefix apps/web test
      - name: Build and package the sole native release artifact without publishing
        run: npm run build
      - name: Reuse the pinned Playwright headless browser
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install native browser journey dependencies
        timeout-minutes: 3
        run: |
          npx playwright install --with-deps --only-shell chromium
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
      - name: Check native release desktop and mobile journeys with synthetic data
        timeout-minutes: 8
        run: |
          # Isolate both process trees so failure/cancellation cleans up children.
          setsid npm run start -- --port 5174 > /tmp/afterparty-web-preview.log 2>&1 &
          preview_pid=$!
          validation_pid=''
          cleanup() {
            result=$?
            trap - EXIT
            if [ "$result" -ne 0 ]; then tail -200 /tmp/afterparty-web-preview.log; fi
            kill -- -"$preview_pid" 2>/dev/null || true
            if [ -n "$validation_pid" ]; then kill -- -"$validation_pid" 2>/dev/null || true; fi
            wait "$preview_pid" 2>/dev/null || true
            if [ -n "$validation_pid" ]; then wait "$validation_pid" 2>/dev/null || true; fi
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT TERM
          node --input-type=module -e 'for(let n=0;n<60;n++){try{if((await fetch("http://127.0.0.1:5174/v3")).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)'
          setsid bash -e -c '
            npm --prefix apps/web run measure:startup
            node apps/web/scripts/browser-ci.ts
            npm --prefix apps/web run test:stack
          ' &
          validation_pid=$!
          result=0
          wait -n -p finished_pid "$preview_pid" "$validation_pid" || result=$?
          if [ "$finished_pid" = "$preview_pid" ]; then
            echo 'The local preview exited before browser validation completed.' >&2
            exit 1
          fi
          exit "$result"
      - name: Preserve preview diagnostics when browser validation fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v3-browser-diagnostics
          path: |
            /tmp/afterparty-web-preview.log
            /tmp/afterparty-wrangler/*.log
          if-no-files-found: ignore
          retention-days: 3
          archive: true
      - name: Package the tested website output without rebuilding
        if: github.event_name == 'push'
        run: python3 scripts/build_release.py website
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: tested-website
          path: release-assets/website.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          archive: true
          overwrite: true
  dependency-review:
    name: ${{ github.event_name == 'workflow_dispatch' && 'manual / dependency-review' || 'dependency-review' }}
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Compare GitHub dependency snapshots without checking out or executing PR code.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: false
          comment-summary-in-pr: never
          show-openssf-scorecard: false
  coverage:
    # Coverage is an explicit report, never another automatic pass over the unit suites.
    if: github.event_name == 'workflow_dispatch' && inputs.coverage_only && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/core/package-lock.json
            apps/web/package-lock.json
      - name: Reuse downloaded FFmpeg packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/afterparty-ffmpeg/*.deb
          key: ffmpeg-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('.github/workflows/core.yml') }}
      - name: Ensure FFmpeg is available for real audio tests
        timeout-minutes: 3
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            mkdir -p "$RUNNER_TEMP/afterparty-ffmpeg"
            sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/afterparty-ffmpeg" -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix services/core ci --omit=peer --ignore-scripts --no-audit --no-fund
      - run: npm --prefix apps/web ci --no-audit --no-fund
      - run: npm run coverage:unit
      - name: Upload the three scoped reports once, without a long-lived token
        if: vars.CODECOV_ENABLED == 'true' && inputs.upload_coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/shared.lcov,coverage/core.lcov,coverage/native.lcov
          disable_search: true
          disable_telem: true
          fail_ci_if_error: true
          handle_no_reports_found: false
  release:
    name: ${{ github.event_name == 'workflow_dispatch' && 'manual / release' || 'release' }}
    needs: [deployer, core, website]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'lukasvri/Afterparty-MusicBot'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tested-*
          path: release-assets
          merge-multiple: true
          digest-mismatch: error
      - name: Prepare the exact manifest before signing
        run: python3 scripts/build_release.py prepare
      - name: Attest all release asset digests from the canonical main workflow
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/core-image.tar.gz
            release-assets/website.tar.gz
            release-assets/release.json
      - name: Preserve the signed bundle for token-free host verification
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp -- "$PROVENANCE_BUNDLE" release-assets/provenance.json
      - name: Publish immutable-by-policy commit-addressed build assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_release.py publish
