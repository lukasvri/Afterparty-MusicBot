name: Core validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deployment failure and recovery tests with synthetic data
        run: python3 -m unittest discover -s tests -v
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck and test Core including FFmpeg
        run: docker build --target validation -t core-validation services/core
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck, browser behavior tests and production build
        run: |
          node node_modules/typescript/bin/tsc --noEmit --incremental false
          node --test scripts/fullscreen.test.mjs scripts/audio-preferences.test.ts scripts/playback-sync.test.ts scripts/live-clock.test.ts scripts/native-seek.test.ts scripts/rooms.test.mjs scripts/bridge.test.mjs scripts/admin-auth.test.mjs scripts/hosting-output.test.ts scripts/afterparty-compatibility.test.ts scripts/releases.test.ts
          npm run build
