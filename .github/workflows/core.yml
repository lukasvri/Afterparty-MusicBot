name: Core validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deployment failure and recovery tests with synthetic data
        run: python3 -m unittest discover -s tests -v
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test once, build the final image and check its runtime
        run: python3 scripts/build_release.py core
      - uses: actions/upload-artifact@v4
        with:
          name: tested-core
          path: |
            release-assets/core-image.tar.gz
            release-assets/core.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install locked Core dependencies for typed integration fixtures
        run: npm --prefix services/core ci --omit=peer --ignore-scripts --no-audit --no-fund
      - name: Lint, typecheck, browser behavior tests and production build
        run: |
          npm run lint
          node node_modules/typescript/bin/tsc --noEmit --incremental false
          npm run test:unit
          npm run build
      - name: Package the tested website output without rebuilding
        run: python3 scripts/build_release.py website
      - uses: actions/upload-artifact@v4
        with:
          name: tested-website
          path: release-assets/website.tar.gz
          if-no-files-found: error
          retention-days: 3
          overwrite: true
  release:
    needs: [deployer, core, website]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'lukasvri/Afterparty-MusicBot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tested-*
          path: release-assets
          merge-multiple: true
      - name: Prepare the exact manifest before signing
        run: python3 scripts/build_release.py prepare
      - name: Attest all release asset digests from the canonical main workflow
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-assets/core-image.tar.gz
            release-assets/website.tar.gz
            release-assets/release.json
      - name: Preserve the signed bundle for token-free host verification
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp -- "$PROVENANCE_BUNDLE" release-assets/provenance.json
      - name: Publish immutable-by-policy commit-addressed build assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_release.py publish
