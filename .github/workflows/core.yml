name: Core validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck and test Core including FFmpeg
        run: docker build --target validation -t core-validation services/core
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck, browser behavior tests and production build
        run: |
          node node_modules/typescript/bin/tsc --noEmit --incremental false
          node --test scripts/fullscreen.test.mjs scripts/audio-preferences.test.mjs scripts/playback-sync.test.mjs
          npm run build
