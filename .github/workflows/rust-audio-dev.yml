name: Rust audio development checks

on:
  pull_request:
    branches: [nightly]
    paths:
      - 'experiments/rust-audio/**'
      - '.github/workflows/rust-audio-dev.yml'
      - 'docs/RUST_DEVELOPMENT.md'
  push:
    branches: [nightly]
    paths:
      - 'experiments/rust-audio/**'
      - '.github/workflows/rust-audio-dev.yml'
      - 'docs/RUST_DEVELOPMENT.md'

permissions:
  contents: read

jobs:
  rust-audio:
    name: Offline Rust mixer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      - name: Formatting
        run: cargo fmt --manifest-path experiments/rust-audio/Cargo.toml --all -- --check
      - name: Lint
        run: cargo clippy --manifest-path experiments/rust-audio/Cargo.toml --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path experiments/rust-audio/Cargo.toml --locked
      - name: Build
        run: cargo build --manifest-path experiments/rust-audio/Cargo.toml --release --locked
