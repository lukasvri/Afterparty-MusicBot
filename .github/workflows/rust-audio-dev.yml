name: Rust audio development checks

on:
  pull_request:
    branches: [dev]
    paths:
      - 'experiments/rust-audio/**'
      - 'services/core/src/audio.ts'
      - 'services/core/package*.json'
      - 'services/core/tsconfig.json'
      - '.github/workflows/rust-audio-dev.yml'
      - 'docs/RUST_DEVELOPMENT.md'
  push:
    branches: [dev]
    paths:
      - 'experiments/rust-audio/**'
      - 'services/core/src/audio.ts'
      - 'services/core/package*.json'
      - 'services/core/tsconfig.json'
      - '.github/workflows/rust-audio-dev.yml'
      - 'docs/RUST_DEVELOPMENT.md'

permissions:
  contents: read

jobs:
  rust-audio:
    name: Offline Rust stream (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain: [stable, "1.85.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal
          rustup default "${{ matrix.toolchain }}"
          rustup component add rustfmt clippy
      - name: Formatting
        run: cargo fmt --manifest-path experiments/rust-audio/Cargo.toml --all -- --check
      - name: Lint
        run: cargo clippy --manifest-path experiments/rust-audio/Cargo.toml --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path experiments/rust-audio/Cargo.toml --locked
      - name: Build
        run: cargo build --manifest-path experiments/rust-audio/Cargo.toml --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked TypeScript reference dependencies
        run: npm --prefix services/core ci --omit=peer --ignore-scripts --no-audit --no-fund
      - name: Typecheck the offline parity harness
        run: node services/core/node_modules/typescript/bin/tsc --project experiments/rust-audio/tsconfig.json --noEmit
      - name: Cross-language PCM, pipe protocol and process lifecycle checks
        run: node --test --test-timeout=30000 experiments/rust-audio/stream-parity.test.ts experiments/rust-audio/worker-client.test.ts
