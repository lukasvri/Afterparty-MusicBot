version: 2
updates:
  # Review one grouped Actions proposal per week. Nothing is auto-merged.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Oslo
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
  # Keep security fixes available without routine npm version-update churn.
  - package-ecosystem: npm
    directories:
      - /
      - /services/core
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']
